# ha-tv-kit · lines to ADD to your existing /config/configuration.yaml.
# Don't replace your file with this one: merge the blocks you need, keeping what's already there.
# If a key (homeassistant:, http:, ...) already exists, put these lines under the existing key.
# Back up first (Settings → System → Backups), then Developer tools → YAML → Check configuration.

homeassistant:
  # Load every file in /config/packages/ (copy homeassistant/packages/*.yaml from this kit there).
  packages: !include_dir_named packages

  # ---- Optional: no-login TV dashboard (docs/04-tv-dashboard.md) --------------------------------
  # Read the security notes in that doc first. Requires a dedicated NON-admin "TV" user.
  # trusted_networks is listed first so the TV goes straight in; everyone else still gets the
  # normal login, because trusted_networks is only offered to requests from the listed IPs.
  # auth_providers:
  #   - type: trusted_networks
  #     trusted_networks:
  #       - 192.168.1.60/32          # each TV's reserved IP, /32 = exactly that one address
  #       - 192.168.1.61/32
  #     trusted_users:
  #       192.168.1.60/32: YOUR_TV_USER_ID     # Settings → People → Users (advanced mode) → the TV user's ID
  #       192.168.1.61/32: YOUR_TV_USER_ID
  #     allow_bypass_login: true
  #   - type: homeassistant          # keep this, or nobody can log in with a password

# ---- The House twin sidebar panel (docs/04-tv-dashboard.md) -------------------------------------
# Files go in /config/www/house-twin/ and are served at /local/house-twin/.
# Bump ?v=N and reload the browser after every change to the JS, or browsers keep the old file.
panel_custom:
  - name: house-twin-panel
    sidebar_title: House
    sidebar_icon: mdi:home-variant
    url_path: house
    module_url: /local/house-twin/house-twin.js?v=1
    require_admin: false
